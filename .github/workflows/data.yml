name: Refresh candidate snapshot
on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 1 * *'
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: echo "STATEATLAS_DATA_VERSION=$(date -u +%F)" >> "$GITHUB_ENV"
      - run: pnpm data:build --refresh
      - run: pnpm test
      - uses: actions/upload-artifact@v7
        with:
          name: stateatlas-candidate-snapshot
          path: |
            data/snapshot/
            public/datasets/
